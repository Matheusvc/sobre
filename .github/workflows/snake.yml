name: Gerar snake de contribuições

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0F0FFF&color_dots=#ebedf0,#c9c8ff,#8f8eff,#5b5bff,#0f0fff
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FFD60A&color_dots=#161b22,#221a86,#2a2290,#5b5bff,#0f0fff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
